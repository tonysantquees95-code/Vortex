name: App (interface e Windows)

# Tudo roda em máquina Windows do GitHub. Verifica a interface, testa o motor e o app, gera o instalador (Tauri)
# e publica uma release "1.N" com VortexSetup.exe. O APK do Android entra no módulo 4b.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: app
      - run: npm run test && npm run typecheck && npm run build
        working-directory: app

  windows:
    needs: verificar
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install --no-audit --no-fund
        working-directory: app
      - name: Instalar o Tauri e gerar os ícones
        run: |
          npm install -g @tauri-apps/cli@2
          cd desktop/src-tauri
          tauri icon ../app-icon.png
      - name: Testar o app e o motor
        run: cargo test --workspace --all-targets
      - name: Gerar o instalador
        working-directory: desktop/src-tauri
        run: tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: vortex-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publicar:
    needs: windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vortex-windows
          path: pacote
      - name: Publicar a versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(ls pacote/*.exe | head -n 1)" pacote/VortexSetup.exe
          gh release create "1.${{ github.run_number }}" pacote/VortexSetup.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Vortex 1.${{ github.run_number }}" --notes "VortexSetup.exe (Windows)."
