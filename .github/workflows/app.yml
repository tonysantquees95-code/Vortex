name: App (interface e Windows)

# Tudo roda em máquina Windows do GitHub. Verifica a interface, testa o motor e o app, gera o instalador (Tauri)
# e o APK do Android (Capacitor + plugin Java), e publica uma release "1.N" com VortexSetup.exe e Vortex.apk.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: app
      - run: npm run test && npm run typecheck && npm run build
        working-directory: app

  windows:
    needs: verificar
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install --no-audit --no-fund
        working-directory: app
      - name: Instalar o Tauri e gerar os ícones
        run: |
          npm install -g @tauri-apps/cli@2
          cd desktop/src-tauri
          tauri icon ../app-icon.png
      - name: Conferir os endereços do motor embutido
        run: |
          curl -fsSIL -o /dev/null https://buildbot.libretro.com/nightly/windows/x86_64/RetroArch.7z
          curl -fsSIL -o /dev/null https://buildbot.libretro.com/nightly/windows/x86_64/latest/snes9x_libretro.dll.zip
      - name: Conferir os downloads do catálogo da loja
        run: |
          node -e 'for (const j of require("./catalogo/catalogo.json").jogos) console.log(j.url)' | while read -r url; do
            curl -fsSIL -o /dev/null "$url" || { echo "Link quebrado: $url"; exit 1; }
          done
      - name: Testar o app e o motor
        run: cargo test --workspace --all-targets
      - name: Gerar o instalador
        working-directory: desktop/src-tauri
        run: tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: vortex-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    needs: verificar
    permissions:
      contents: read
      id-token: write
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install --no-audit --no-fund
        working-directory: app
      - name: Testar o motor do Android (sem o Android)
        run: |
          curl -fsSL -o json.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          mkdir -p saida
          javac -cp json.jar -d saida android/src/Plataformas.java android/src/Motor.java android/src/Organizador.java android/teste/MotorTeste.java
          java -cp "json.jar;saida" tech.vetorial.vortex.MotorTeste
      - name: Preparar o projeto Android
        working-directory: app
        run: |
          npm run build
          npx cap add android
          D=android/app/src/main/java/tech/vetorial/vortex
          mkdir -p $D
          cp ../android/src/*.java $D/
          # permissões: arquivos (liberada pela pessoa), apps instalados (achar emuladores) e controle
          PERMS='<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />'
          sed -i "s#<application#$PERMS\n    <application#" android/app/src/main/AndroidManifest.xml
          grep -c "uses-permission" android/app/src/main/AndroidManifest.xml
          # entregar a ROM ao emulador por FileProvider (o Capacitor já declara o ".fileprovider"; aqui liberamos os caminhos)
          grep -q 'fileprovider' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<paths xmlns:android="http://schemas.android.com/apk/res/android">' '    <root-path name="raiz" path="." />' '    <cache-path name="cache" path="." />' '</paths>' > android/app/src/main/res/xml/file_paths.xml
          # catálogo da loja (lido pelo plugin)
          mkdir -p android/app/src/main/assets
          cp ../catalogo/catalogo.json android/app/src/main/assets/catalogo.json
          # tela do jogo: o motor de emulação (LibretroDroid) mora no JitPack
          sed -i 's#mavenCentral()#mavenCentral()\n        maven { url "https://jitpack.io" }#' android/build.gradle
          grep -n jitpack android/build.gradle
          sed -i "0,/dependencies {/s#dependencies {#dependencies {\n    implementation 'com.github.swordfish90:libretrodroid:0.14.0'#" android/app/build.gradle
          grep -n libretrodroid android/app/build.gradle
          # tela cheia e deitado, como um console
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' android/app/src/main/AndroidManifest.xml
          # tela do jogo (motor de emulação embutido: LibretroDroid) e o repositório JitPack onde ele mora
          sed -i 's#</application>#    <activity android:name=".JogoActivity" android:exported="false" android:screenOrientation="sensorLandscape" android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation|uiMode" android:theme="@style/AppTheme.NoActionBar" />\n    </application>#' android/app/src/main/AndroidManifest.xml
          npx capacitor-assets generate --android --iconBackgroundColor '#05060D' --iconBackgroundColorDark '#05060D' --splashBackgroundColor '#05060D' --splashBackgroundColorDark '#05060D'
          npx cap sync android
      - name: Compilar o APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      # A chave de assinatura fica guardada (cifrada) no servidor da Vênus: cada versão instala por cima da anterior.
      - name: Assinar o APK
        run: bash .github/assinar-apk.sh app/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vortex-android
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publicar:
    needs: [windows, android]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vortex-windows
          path: pacote
      - uses: actions/download-artifact@v4
        with:
          name: vortex-android
          path: pacote
      - name: Publicar a versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp pacote/app-debug.apk pacote/Vortex.apk
          cp "$(ls pacote/*.exe | head -n 1)" pacote/VortexSetup.exe
          gh release create "1.${{ github.run_number }}" pacote/Vortex.apk pacote/VortexSetup.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Vortex 1.${{ github.run_number }}" --notes "Vortex.apk (Android) e VortexSetup.exe (Windows)."
