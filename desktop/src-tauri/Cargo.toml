[package]
name = "vortex-desktop"
version = "1.0.0"
edition = "2021"
description = "Vortex para Windows (Tauri)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
vortex-core = { path = "../../core" }
