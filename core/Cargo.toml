[package]
name = "vortex-core"
version = "1.0.0"
edition = "2021"
description = "Motor do Vortex: varredura e indexação de jogos, metadados, capas e histórico de tempo de jogo."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
sysinfo = "0.32"
ureq = "2"
sevenz-rust = "0.6"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Power"] }

[dev-dependencies]
tempfile = "3"
