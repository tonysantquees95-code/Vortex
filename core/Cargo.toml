[package]
name = "vortex-core"
version = "1.0.0"
edition = "2021"
description = "Motor do Vortex: varredura e indexação de jogos, metadados, capas e histórico de tempo de jogo."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
